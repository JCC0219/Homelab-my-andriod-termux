<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WOL Control Center</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#0284c7',
                            600: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-6 px-4 font-sans antialiased">

    <div class="max-w-md mx-auto space-y-5">
        <!-- Header -->
        <header class="text-center space-y-1">
            <h1 class="text-2xl font-bold tracking-tight text-sky-400 flex items-center justify-center gap-2">
                <span>⚡</span> WOL Control Center
            </h1>
            <p class="text-xs text-slate-400 font-medium">Termux Local Gateway Server</p>
        </header>

        <!-- Add Device Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
            <h2 class="text-base font-semibold text-slate-200 flex items-center gap-2">
                <span>➕</span> Add New Device
            </h2>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Device Name</label>
                    <input type="text" id="devName" placeholder="e.g. Windows Workstation"
                           class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-medium text-slate-400">IP Address</label>
                        <span class="text-[10px] uppercase font-semibold tracking-wider text-slate-500 bg-slate-800/60 px-1.5 py-0.5 rounded">Optional</span>
                    </div>
                    <input type="text" id="devIp" placeholder="e.g. 192.168.1.100"
                           class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">MAC Address</label>
                    <input type="text" id="devMac" placeholder="e.g. AA:BB:CC:DD:EE:FF"
                           class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition">
                </div>
            </div>

            <button onclick="addDevice()" 
                    class="w-full py-2.5 px-4 bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold text-sm rounded-xl transition shadow-lg shadow-sky-500/10 active:scale-[0.98]">
                Save Device
            </button>
        </div>

        <!-- Device List Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
            <h2 class="text-base font-semibold text-slate-200 flex items-center gap-2">
                <span>💻</span> Devices
            </h2>
            
            <div id="deviceList" class="divide-y divide-slate-800/80">
                <p class="text-slate-500 text-sm text-center py-4">Loading devices...</p>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 px-5 py-2.5 bg-slate-800 text-slate-100 border border-slate-700 text-xs font-medium rounded-full shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-50 whitespace-nowrap">
    </div>

    <script>
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                t.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        async function fetchDevices() {
            try {
                const res = await fetch('/api/devices');
                const devices = await res.json();
                const listEl = document.getElementById('deviceList');
                
                if (devices.length === 0) {
                    listEl.innerHTML = '<p class="text-slate-500 text-sm text-center py-6">No devices found. Add one above.</p>';
                    return;
                }

                listEl.innerHTML = devices.map((d, index) => {
                    const hasIp = Boolean(d.ip && d.ip.trim());
                    
                    let statusHtml = '';
                    if (hasIp) {
                        statusHtml = `
                            <span id="status-${index}" class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-800 text-slate-400 border border-slate-700/50 shrink-0">
                                <span class="w-1.5 h-1.5 rounded-full bg-slate-400 animate-pulse"></span> Checking...
                            </span>`;
                    } else {
                        statusHtml = `
                            <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20 shrink-0">
                                <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span> No IP
                            </span>`;
                    }

                    return `
                        <div class="py-4 first:pt-0 last:pb-0 space-y-2.5">
                            <!-- Top Row: Name and Status Badge -->
                            <div class="flex items-center justify-between gap-2">
                                <span class="font-semibold text-sm text-slate-100 break-words leading-tight">${d.name}</span>
                                ${statusHtml}
                            </div>
                            
                            <!-- Bottom Row: Details and Action Buttons -->
                            <div class="flex items-end justify-between gap-2 pt-1">
                                <div class="text-[11px] font-mono text-slate-400 tracking-tight leading-relaxed">
                                    ${d.ip ? `<div class="text-slate-300 font-sans">${d.ip}</div>` : ''}
                                    <div class="text-slate-500">${d.mac}</div>
                                </div>
                                <div class="flex items-center gap-2 shrink-0">
                                    <button onclick="wakeDevice('${d.mac}')" 
                                            class="px-3.5 py-1.5 bg-emerald-500/10 hover:bg-emerald-500/20 active:bg-emerald-500/30 text-emerald-400 border border-emerald-500/20 rounded-xl text-xs font-semibold transition active:scale-95">
                                        Wake
                                    </button>
                                    <button onclick="deleteDevice(${index})" 
                                            class="px-3 py-1.5 bg-rose-500/10 hover:bg-rose-500/20 active:bg-rose-500/30 text-rose-400 border border-rose-500/20 rounded-xl text-xs font-semibold transition active:scale-95">
                                        Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                devices.forEach((d, index) => {
                    if (d.ip && d.ip.trim()) checkStatus(d.ip, index);
                });

            } catch (e) {
                document.getElementById('deviceList').innerHTML = '<p class="text-rose-400 text-sm text-center py-4">Failed to load devices.</p>';
            }
        }

        async function checkStatus(ip, index) {
            const statusEl = document.getElementById(`status-${index}`);
            if (!statusEl) return;

            try {
                const res = await fetch(`/api/ping?ip=${ip}`);
                const data = await res.json();
                
                if (data.online) {
                    statusEl.className = 'inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 shrink-0';
                    statusEl.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_6px_rgba(52,211,153,0.8)]"></span> Online';
                } else {
                    statusEl.className = 'inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium bg-rose-500/10 text-rose-400 border border-rose-500/20 shrink-0';
                    statusEl.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span> Offline';
                }
            } catch (e) {
                statusEl.className = 'inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-800 text-slate-400 border border-slate-700/50 shrink-0';
                statusEl.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-slate-500"></span> Unknown';
            }
        }

        async function addDevice() {
            const name = document.getElementById('devName').value.trim();
            const ip = document.getElementById('devIp').value.trim();
            const mac = document.getElementById('devMac').value.trim();
            
            if (!name || !mac) {
                showToast("⚠️ Device Name and MAC Address are required");
                return;
            }

            const res = await fetch('/api/devices', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, ip, mac })
            });

            if (res.ok) {
                document.getElementById('devName').value = '';
                document.getElementById('devIp').value = '';
                document.getElementById('devMac').value = '';
                showToast("✅ Device added successfully");
                fetchDevices();
            }
        }

        async function deleteDevice(index) {
            if (!confirm("Are you sure you want to delete this device?")) return;
            const res = await fetch(`/api/devices?index=${index}`, { method: 'DELETE' });
            if (res.ok) {
                showToast("🗑️ Device deleted");
                fetchDevices();
            }
        }

        async function wakeDevice(mac) {
            showToast("🚀 Sending Magic Packet...");
            const res = await fetch('/api/wake', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mac })
            });
            const data = await res.json();
            if (data.status === 'ok') {
                showToast("✅ Magic packet sent successfully!");
                setTimeout(fetchDevices, 10000);
            } else {
                showToast("❌ Failed: " + data.message);
            }
        }

        fetchDevices();
        setInterval(fetchDevices, 10000);
    </script>
</body>
</html>
